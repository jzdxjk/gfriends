name: Update Filetree and Badges

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-filetree-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-filetree:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Update Filetree.json
        run: ./scripts/update_filetree_local.sh

      - name: Commit generated files
        run: |
          if git diff --quiet -- Filetree.json README.md; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Filetree.json README.md
          git commit -m "AutoUpdate Filetree.json and README badges"
          git push
