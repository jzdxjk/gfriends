name: Update Filetree and Badges

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-filetree-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-filetree:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout: |
            /.github/workflows/update-filetree.yml
            /scripts/update_filetree.py
            /scripts/update_filetree_local.sh
            /Filetree.json
            /README.md
          sparse-checkout-cone-mode: false

      - name: Install image metadata dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Fetch previous commit
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --filter=blob:none --depth=1 origin "${{ github.event.before }}"

      - name: Materialize changed Content images
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            git diff-tree --no-commit-id --name-only --find-renames --root -z -r \
              "${AFTER_SHA}" -- Content \
              | xargs -0 -r git sparse-checkout add --skip-checks
          else
            git diff --name-only --find-renames -z \
              "${BEFORE_SHA}" "${AFTER_SHA}" -- Content \
              | xargs -0 -r git sparse-checkout add --skip-checks
          fi

      - name: Materialize full Content for manual rebuild
        if: github.event_name == 'workflow_dispatch'
        run: git sparse-checkout disable

      - name: Update Filetree.json
        if: github.event_name == 'push'
        run: |
          ./scripts/update_filetree_local.sh \
            --changed-from "${{ github.event.before }}" \
            --changed-to "${{ github.sha }}"

      - name: Full rebuild Filetree.json
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/update_filetree_local.sh --all --refresh-dimensions

      - name: Commit generated files
        run: |
          if git diff --quiet -- Filetree.json README.md; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Filetree.json README.md
          git commit -m "AutoUpdate Filetree.json image dimensions and badges"
          git push

      - name: Publish Filetree Release asset
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag='filetree-latest'
          source_commit="$(git rev-parse HEAD)"
          checksum_path="Filetree.json.sha256"
          sha256sum Filetree.json > "${checksum_path}"
          notes_path="$(mktemp)"
          trap 'rm -f "${notes_path}"' EXIT
          {
            echo 'Gfriends Filetree latest release asset.'
            echo
            echo "Filetree-Commit: ${source_commit}"
            echo "Generated-At: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${notes_path}"

          if gh release view "${release_tag}" --json id >/dev/null 2>&1; then
            gh release upload "${release_tag}" Filetree.json "${checksum_path}" --clobber
            gh release edit "${release_tag}" \
              --title 'Gfriends Filetree (latest)' \
              --notes-file "${notes_path}" \
              --draft=false \
              --latest=false
          else
            gh release create "${release_tag}" Filetree.json "${checksum_path}" \
              --target "${source_commit}" \
              --title 'Gfriends Filetree (latest)' \
              --notes-file "${notes_path}" \
              --latest=false
          fi
